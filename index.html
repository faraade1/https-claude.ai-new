<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Printwise | Reseller operations</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17233b;background:#f6f7fb;font-synthesis:none;text-rendering:optimizeLegibility;--navy:#17233b;--muted:#758198;--line:#e7eaf0;--blue:#3569e8;--blue-pale:#edf2ff;--green:#198a69;--amber:#b67a15;--red:#c44848}
    *{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:26px 16px;display:flex;flex-direction:column;gap:28px}.brand{display:flex;align-items:center;gap:11px;padding:0 10px}.brand-mark{width:37px;height:37px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:19px;font-weight:800}.brand-name{font-weight:750;font-size:18px;letter-spacing:-.4px}.brand-sub{font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:.8px;text-transform:uppercase}.nav-label{font-size:10px;letter-spacing:1.2px;font-weight:750;color:#9aa3b3;padding:0 12px;margin:6px 0 8px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#626f85;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:12px;align-items:center;font-size:13px;font-weight:600}.nav button:hover,.nav button.active{background:var(--blue-pale);color:var(--blue)}.nav-icon{width:19px;text-align:center;font-size:16px}.side-bottom{margin-top:auto}.help-card{padding:14px;background:#f7f8fb;border:1px solid var(--line);border-radius:11px;font-size:12px;color:var(--muted);line-height:1.55}.help-card strong{display:block;color:var(--navy);margin-bottom:4px}.main{min-width:0}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;gap:20px}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--navy);font-weight:700}.top-actions{display:flex;align-items:center;gap:13px}.search-wrap{position:relative}.search-wrap span{position:absolute;left:12px;top:9px;color:#99a3b4}.search{border:1px solid var(--line);border-radius:8px;padding:9px 12px 9px 34px;width:220px;outline:none;font-size:12px}.search:focus,input:focus,select:focus,textarea:focus{border-color:#9bb4ff;box-shadow:0 0 0 3px #edf2ff}.avatar{width:34px;height:34px;border-radius:50%;background:#e8edfa;color:#3d5fa8;display:grid;place-items:center;font-size:11px;font-weight:750}.content{max-width:1450px;margin:0 auto;padding:32px 34px 48px}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:25px}.eyebrow{font-size:11px;color:var(--blue);font-weight:750;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}.page-head h1{font-size:25px;letter-spacing:-.7px;margin:0 0 6px}.page-head p{font-size:13px;color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:#fff;color:#34415a;border-radius:8px;padding:10px 14px;font-size:12px;font-weight:650;display:inline-flex;align-items:center;gap:7px}.btn:hover{background:#f8f9fc}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.primary:hover{background:#2859d2}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat,.panel{background:#fff;border:1px solid var(--line);border-radius:12px}.stat{padding:17px 18px}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;font-weight:600}.stat-icon{width:30px;height:30px;display:grid;place-items:center;border-radius:8px;background:#f1f4fb;font-size:15px}.stat-value{font-size:26px;font-weight:750;letter-spacing:-.8px;margin:13px 0 4px}.stat-note{font-size:11px;color:var(--muted)}.stat-note .positive{color:var(--green);font-weight:650}.dashboard-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(270px,.9fr);gap:18px}.panel{padding:19px 20px;margin-bottom:18px;min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel-title{font-size:14px;font-weight:700}.panel-sub{font-size:11px;color:var(--muted);margin-top:4px}.link-btn{border:0;background:none;color:var(--blue);font-size:11px;font-weight:700;padding:5px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#8993a5;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.65px;padding:10px 9px;border-bottom:1px solid var(--line)}td{font-size:12px;padding:12px 9px;border-bottom:1px solid #f0f1f5;color:#435069}tbody tr:last-child td{border-bottom:0}.primary-cell{color:var(--navy);font-weight:650}.secondary-cell{display:block;font-size:10px;color:var(--muted);margin-top:3px}.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700}.badge:before{content:"";width:5px;height:5px;background:currentColor;border-radius:50%}.badge.green{background:#eaf7f1;color:var(--green)}.badge.amber{background:#fff5e3;color:var(--amber)}.badge.blue{background:#edf2ff;color:var(--blue)}.badge.red{background:#fff0f0;color:var(--red)}.badge.gray{background:#f1f3f6;color:#788397}.activity{display:grid;gap:17px}.activity-item{display:flex;gap:11px;align-items:flex-start}.activity-dot{width:29px;height:29px;border-radius:9px;background:#eef2fb;display:grid;place-items:center;flex:none;font-size:13px}.activity-text{font-size:11px;line-height:1.45;color:#647188}.activity-text strong{color:#24314a;font-weight:650}.activity-time{font-size:10px;color:#9aa3b2;margin-top:3px}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.quick{border:1px solid var(--line);border-radius:9px;background:#fff;padding:12px;text-align:left;color:var(--navy)}.quick:hover{border-color:#b8c8f7;background:#f9faff}.quick b{font-size:11px;display:block;margin-top:8px}.quick span{font-size:16px;color:var(--blue)}.table-panel{padding:0;overflow:hidden}.table-panel .panel-head{padding:19px 20px 0}.empty{padding:34px;text-align:center;color:var(--muted);font-size:12px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}.filter-select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;font-size:11px;color:#536078}.modal-backdrop{position:fixed;inset:0;background:rgba(20,30,50,.38);display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-backdrop.open{display:flex}.modal{width:min(500px,100%);background:#fff;border-radius:14px;padding:23px;box-shadow:0 20px 70px #10204030}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:18px;margin:0}.close{border:0;background:#f3f5f8;border-radius:7px;width:30px;height:30px;color:#66738a;font-size:18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:650;color:#59657a}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 10px;font-size:12px;outline:none}.field textarea{resize:vertical;min-height:75px}.form-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.toast{position:fixed;bottom:22px;right:24px;padding:12px 16px;background:#1f2d45;color:#fff;border-radius:9px;font-size:12px;box-shadow:0 7px 25px #1113;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:8}.toast.show{opacity:1;transform:translateY(0)}.footer-note{font-size:10px;color:#9aa3b1;text-align:center;margin-top:24px}
    @media(max-width:950px){.shell{grid-template-columns:205px 1fr}.content{padding:26px 22px}.topbar{padding:0 22px}.stats{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}}
    @media(max-width:650px){.shell{grid-template-columns:1fr}.sidebar{padding:12px 14px;border-right:0;border-bottom:1px solid var(--line);gap:12px}.brand{padding:0 4px}.brand-mark{width:32px;height:32px}.brand-name{font-size:16px}.nav-label,.side-bottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.nav-icon{display:none}.topbar{height:58px;padding:0 16px}.search{width:150px}.content{padding:23px 15px}.stats{gap:9px}.stat{padding:13px}.stat-value{font-size:22px}.page-head h1{font-size:22px}.page-head{align-items:center}.page-head p{max-width:260px;line-height:1.5}.btn{padding:9px 10px}.page-head>.btn{font-size:0}.page-head>.btn span{font-size:15px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">P</div><div><div class="brand-name">Printwise</div><div class="brand-sub">Reseller operations</div></div></div>
      <div><div class="nav-label">WORKSPACE</div><nav class="nav" id="nav">
        <button class="active" data-page="dashboard"><span class="nav-icon">▦</span>Overview</button>
        <button data-page="equipment"><span class="nav-icon">▣</span>Equipment</button>
        <button data-page="service"><span class="nav-icon">⌁</span>Service desk</button>
        <button data-page="supplies"><span class="nav-icon">▤</span>Supplies</button>
        <button data-page="customers"><span class="nav-icon">♙</span>Customers</button>
        <button data-page="quotes"><span class="nav-icon">▧</span>Quotes</button>
      </nav></div>
      <div class="side-bottom"><div class="help-card"><strong>Need a hand?</strong>Keep customer equipment, service work, and supply orders organized in one place.</div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div class="crumb">Workspace&nbsp; / &nbsp;<strong id="crumb">Overview</strong></div><div class="top-actions"><div class="search-wrap"><span>⌕</span><input id="global-search" class="search" placeholder="Search records..." aria-label="Search records"></div><div class="avatar" title="Account">AA</div></div></header>
      <section class="content" id="app"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">New record</h2><button class="close" id="close-modal" aria-label="Close">×</button></div><form id="record-form"><div class="form-grid" id="form-fields"></div><div class="form-actions"><button type="button" class="btn" id="cancel-modal">Cancel</button><button type="submit" class="btn primary">Save record</button></div></form></section></div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const seed={
      equipment:[
        {model:'AltaLink C8155',serial:'XRX-18429',customer:'Northstar Legal Group',location:'Boston, MA',status:'Active',contract:'Managed print'},
        {model:'VersaLink C405',serial:'XRX-18217',customer:'Harborview Dental',location:'Cambridge, MA',status:'Active',contract:'Service only'},
        {model:'PrimeLink C9070',serial:'XRX-17903',customer:'Beacon Design Studio',location:'Somerville, MA',status:'Install scheduled',contract:'New deployment'},
        {model:'WorkCentre 6515',serial:'XRX-16380',customer:'Riverside Accounting',location:'Medford, MA',status:'Needs attention',contract:'Managed print'}
      ],
      service:[
        {id:'SR-2048',customer:'Riverside Accounting',device:'WorkCentre 6515',issue:'Paper jam / feed issue',priority:'High',status:'In progress',due:'Today'},
        {id:'SR-2047',customer:'Harborview Dental',device:'VersaLink C405',issue:'Preventive maintenance',priority:'Normal',status:'Scheduled',due:'Nov 20'},
        {id:'SR-2046',customer:'Northstar Legal Group',device:'AltaLink C8155',issue:'Print quality check',priority:'Normal',status:'Open',due:'Nov 21'},
        {id:'SR-2045',customer:'Beacon Design Studio',device:'PrimeLink C9070',issue:'Installation and setup',priority:'High',status:'Scheduled',due:'Nov 22'}
      ],
      supplies:[
        {item:'Black Toner Cartridge',sku:'106R03943',compatible:'AltaLink C8130 / C8135 / C8145 / C8155',stock:18,reorder:6,price:'$184.00'},
        {item:'Cyan Toner Cartridge',sku:'106R03946',compatible:'AltaLink C8130 / C8135 / C8145 / C8155',stock:4,reorder:6,price:'$212.00'},
        {item:'Waste Toner Container',sku:'008R13061',compatible:'VersaLink C400 / C405',stock:11,reorder:4,price:'$39.50'},
        {item:'Drum Cartridge',sku:'013R00670',compatible:'WorkCentre 6515',stock:2,reorder:3,price:'$96.00'}
      ],
      customers:[
        {name:'Northstar Legal Group',contact:'Maya Chen',email:'maya@northstar.example',equipment:3,agreement:'Managed print'},
        {name:'Harborview Dental',contact:'Chris Patel',email:'chris@harborview.example',equipment:2,agreement:'Service only'},
        {name:'Beacon Design Studio',contact:'Jordan Lee',email:'jordan@beacon.example',equipment:1,agreement:'New deployment'},
        {name:'Riverside Accounting',contact:'Sam Rivera',email:'sam@riverside.example',equipment:2,agreement:'Managed print'}
      ],
      quotes:[
        {id:'QT-1184',customer:'Beacon Design Studio',summary:'PrimeLink C9070 + installation',amount:'$18,450',status:'Sent',date:'Nov 16'},
        {id:'QT-1183',customer:'Northstar Legal Group',summary:'Quarterly toner replenishment',amount:'$1,280',status:'Approved',date:'Nov 15'},
        {id:'QT-1182',customer:'Harborview Dental',summary:'Service agreement renewal',amount:'$960',status:'Draft',date:'Nov 14'}
      ]
    };
    const storeKey='printwise-reseller-data-v1';
    let data;try{data=JSON.parse(localStorage.getItem(storeKey))||seed}catch{data=seed}
    const meta={
      equipment:{title:'Equipment',sub:'Track installed devices, locations, and coverage.',button:'Add equipment',icon:'▣',cols:['Device / model','Serial number','Customer','Location','Coverage','Status'],keys:['model','serial','customer','location','contract','status'],fields:[['model','Model name','text'],['serial','Serial number','text'],['customer','Customer','text'],['location','Location','text'],['contract','Coverage / agreement','text'],['status','Status','select','Active|Install scheduled|Needs attention']]},
      service:{title:'Service desk',sub:'Manage open service calls, priorities, and technician follow-up.',button:'New service ticket',icon:'⌁',cols:['Ticket','Customer','Device','Issue','Priority','Status','Due'],keys:['id','customer','device','issue','priority','status','due'],fields:[['customer','Customer','text'],['device','Device / model','text'],['issue','Issue summary','text'],['priority','Priority','select','Normal|High|Urgent'],['status','Status','select','Open|In progress|Scheduled|Resolved'],['due','Due date','text']]},
      supplies:{title:'Supplies',sub:'Keep consumables in stock and identify items to reorder.',button:'Add supply item',icon:'▤',cols:['Item','SKU','Compatible devices','Stock','Reorder point','Unit price'],keys:['item','sku','compatible','stock','reorder','price'],fields:[['item','Item name','text'],['sku','SKU','text'],['compatible','Compatible devices','text'],['stock','Quantity in stock','number'],['reorder','Reorder point','number'],['price','Unit price','text']]},
      customers:{title:'Customers',sub:'View customer contacts and their installed equipment base.',button:'Add customer',icon:'♙',cols:['Customer','Primary contact','Email','Devices','Agreement'],keys:['name','contact','email','equipment','agreement'],fields:[['name','Customer name','text'],['contact','Primary contact','text'],['email','Email','email'],['equipment','Equipment count','number'],['agreement','Agreement','text']]},
      quotes:{title:'Quotes',sub:'Prepare and follow up on equipment, service, and supply proposals.',button:'Create quote',icon:'▧',cols:['Quote','Customer','Summary','Amount','Status','Date'],keys:['id','customer','summary','amount','status','date'],fields:[['customer','Customer','text'],['summary','Quote summary','text'],['amount','Amount','text'],['status','Status','select','Draft|Sent|Approved|Expired'],['date','Date','text']]}
    };
    let current='dashboard';let query='';
    const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const badge=(status)=>{let c='gray';if(/active|approved|resolved/i.test(status))c='green';else if(/progress|scheduled|sent/i.test(status))c='blue';else if(/high|urgent|attention|draft/i.test(status))c='amber';else if(/open|expired/i.test(status))c='red';return `<span class="badge ${c}">${esc(status)}</span>`};
    function save(){localStorage.setItem(storeKey,JSON.stringify(data))}
    function tableRows(type,limit=Infinity){const m=meta[type],list=(data[type]||[]).filter(row=>Object.values(row).some(v=>String(v).toLowerCase().includes(query))).slice(0,limit);if(!list.length)return `<tr><td colspan="${m.cols.length}" class="empty">No matching records. Add one to get started.</td></tr>`;return list.map(row=>`<tr>${m.keys.map((key,i)=>{let value=row[key];if(key==='status'||key==='priority')return `<td>${badge(value)}</td>`;if(key==='stock')return `<td><span class="${Number(value)<=Number(row.reorder)?'badge red':'primary-cell'}">${esc(value)}${Number(value)<=Number(row.reorder)?' · reorder':''}</span></td>`;if(i===0)return `<td class="primary-cell">${esc(value)}${type==='customers'?`<span class="secondary-cell">Customer account</span>`:''}</td>`;return `<td>${esc(value)}</td>`}).join('')}</tr>`}).join('')}
    function tablePanel(type,limit){const m=meta[type];return `<div class="panel table-panel"><div class="panel-head"><div><div class="panel-title">${m.title}</div><div class="panel-sub">${limit?`Latest ${m.title.toLowerCase()} activity`:`${(data[type]||[]).length} records`}</div></div>${limit?`<button class="link-btn" data-go="${type}">View all →</button>`:''}</div><div class="table-wrap"><table><thead><tr>${m.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${tableRows(type,limit)}</tbody></table></div></div>`}
    function dashboard(){let open=data.service.filter(x=>!['Resolved','Closed'].includes(x.status)).length,low=data.supplies.filter(x=>Number(x.stock)<=Number(x.reorder)).length;return `<div class="page-head"><div><div class="eyebrow">Tuesday, November 18</div><h1>Good morning, Alex</h1><p>Here’s what’s happening across your reseller business today.</p></div><button class="btn primary" data-modal="service"><span>＋</span> New service ticket</button></div>
      <div class="stats"><div class="stat"><div class="stat-top">Active devices <span class="stat-icon">▣</span></div><div class="stat-value">${data.equipment.length}</div><div class="stat-note"><span class="positive">${data.equipment.filter(x=>x.status==='Active').length} online</span> across customer sites</div></div><div class="stat"><div class="stat-top">Open service calls <span class="stat-icon">⌁</span></div><div class="stat-value">${open}</div><div class="stat-note"><span class="${open?'positive':''}">${data.service.filter(x=>x.priority==='High'||x.priority==='Urgent').length} high priority</span> needing attention</div></div><div class="stat"><div class="stat-top">Low stock items <span class="stat-icon">▤</span></div><div class="stat-value">${low}</div><div class="stat-note">At or below reorder point</div></div><div class="stat"><div class="stat-top">Quotes to follow up <span class="stat-icon">▧</span></div><div class="stat-value">${data.quotes.filter(x=>x.status==='Sent'||x.status==='Draft').length}</div><div class="stat-note">Draft or awaiting customer</div></div></div>
      <div class="dashboard-grid"><div>${tablePanel('service',4)}${tablePanel('supplies',4)}</div><div><div class="panel"><div class="panel-head"><div><div class="panel-title">Quick actions</div><div class="panel-sub">Create and track daily work</div></div></div><div class="quick-grid"><button class="quick" data-modal="equipment"><span>▣</span><b>Add equipment</b></button><button class="quick" data-modal="service"><span>⌁</span><b>Log a service call</b></button><button class="quick" data-modal="supplies"><span>▤</span><b>Record supplies</b></button><button class="quick" data-modal="quotes"><span>▧</span><b>Start a quote</b></button></div></div><div class="panel"><div class="panel-head"><div><div class="panel-title">Recent activity</div><div class="panel-sub">Latest updates from your workspace</div></div></div><div class="activity"><div class="activity-item"><div class="activity-dot">⌁</div><div class="activity-text"><strong>Service call SR-2048</strong> marked in progress for Riverside Accounting<div class="activity-time">Today · Service desk</div></div></div><div class="activity-item"><div class="activity-dot">▧</div><div class="activity-text"><strong>Quote QT-1184</strong> sent to Beacon Design Studio<div class="activity-time">Nov 16 · Quotes</div></div></div><div class="activity-item"><div class="activity-dot">▤</div><div class="activity-text"><strong>${low} supply item${low===1?'':'s'}</strong> at or below reorder point<div class="activity-time">Review inventory</div></div></div></div></div></div></div><div class="footer-note">Demo workspace · Records are saved in this browser.</div>`}
    function pageContent(){if(current==='dashboard')return dashboard();const m=meta[current];return `<div class="page-head"><div><div class="eyebrow">WORKSPACE / ${m.title.toUpperCase()}</div><h1>${m.title}</h1><p>${m.sub}</p></div><button class="btn primary" data-modal="${current}"><span>＋</span> ${m.button}</button></div><div class="toolbar"><div class="panel-sub">${(data[current]||[]).length} total records</div><select class="filter-select" id="status-filter"><option value="">All statuses</option>${[...new Set((data[current]||[]).map(x=>x.status).filter(Boolean))].map(s=>`<option>${esc(s)}</option>`).join('')}</select></div>${tablePanel(current)}<div class="footer-note">Demo workspace · Records are saved in this browser. Verify device compatibility and commercial details before placing orders.</div>`}
    function render(){document.getElementById('app').innerHTML=pageContent();document.getElementById('crumb').textContent=current==='dashboard'?'Overview':meta[current].title;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===current));const filter=document.getElementById('status-filter');if(filter)filter.addEventListener('change',()=>{let val=filter.value;document.querySelectorAll('tbody tr').forEach(row=>row.style.display=!val||row.innerText.includes(val)?'':'none')});}
    function openModal(type){currentModal=type;const m=meta[type];document.getElementById('modal-title').textContent=m.button;document.getElementById('form-fields').innerHTML=m.fields.map(([key,label,kind,options])=>`<div class="field ${kind==='textarea'?'full':''}"><label for="f-${key}">${label}</label>${kind==='select'?`<select id="f-${key}" name="${key}" required>${options.split('|').map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="f-${key}" name="${key}" type="${kind}" ${kind==='number'?'min="0"':''} required>`}</div>`).join('');document.getElementById('modal-backdrop').classList.add('open');setTimeout(()=>document.querySelector('#form-fields input')?.focus(),20)}
    let currentModal='';function closeModal(){document.getElementById('modal-backdrop').classList.remove('open')}
    function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500)}
    document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;current=b.dataset.page;query='';document.getElementById('global-search').value='';render()});
    document.getElementById('app').addEventListener('click',e=>{const go=e.target.closest('[data-go]'),add=e.target.closest('[data-modal]');if(go){current=go.dataset.go;render()}else if(add)openModal(add.dataset.modal)});
    document.getElementById('global-search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
    document.getElementById('close-modal').addEventListener('click',closeModal);document.getElementById('cancel-modal').addEventListener('click',closeModal);document.getElementById('modal-backdrop').addEventListener('click',e=>{if(e.target.id==='modal-backdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
    document.getElementById('record-form').addEventListener('submit',e=>{e.preventDefault();const m=meta[currentModal],form=new FormData(e.target),record={};m.fields.forEach(([key])=>record[key]=form.get(key));if(currentModal==='service')record.id=`SR-${2050+data.service.length}`;if(currentModal==='quotes'){record.id=`QT-${1185+data.quotes.length}`;record.date=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'})}if(currentModal==='supplies'){record.stock=Number(record.stock);record.reorder=Number(record.reorder)}if(currentModal==='customers')record.equipment=Number(record.equipment);data[currentModal].unshift(record);save();closeModal();current=currentModal;render();toast(`${m.title} record saved`)});
    render();
  </script>
</body>
</html>
